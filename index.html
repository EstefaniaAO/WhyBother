<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WHY BOTHER? — Generative Rabbit Hole & CREATE</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="mode-narrative">
  <!-- Rabbit Hole Canvas -->
  <div id="canvas-container">
    <canvas id="tunnel-canvas"></canvas>
  </div>

  <!-- Narrative Overlay (Book Opening) -->
  <div id="narrative-overlay" class="narrative-overlay">
    <!-- Opening Book Visual (Fixed dimensions, stable layout) -->
    <div id="opening-book-container" class="book-container">
      <div class="book-cover">
        <div class="book-page book-page-left">
          <div class="book-illustration-ornament">✦ 1865 ✦</div>
          <p class="book-subheading">Alicia en el País de las Maravillas</p>
          <div class="book-divider"></div>
          <div class="book-page-decor">Capítulo I<br>En la Madriguera del Conejo</div>
        </div>
        <div class="book-page book-page-right">
          <div class="book-text-body" id="book-text-body"></div>
        </div>
      </div>
    </div>

    <!-- Discreet Continue Prompt for Book Opening (Appears ONLY when book text finishes) -->
    <div id="narrative-continue-hint" class="narrative-continue-hint">
      <span class="hint-symbol">␣</span> Presiona <kbd>ESPACIO</kbd> o haz <kbd>CLIC</kbd> para continuar
    </div>
  </div>

  <!-- Cinematic Phrase-by-Phrase Transition Screen (Disney, Game, CREATE) -->
  <div id="cinematic-overlay" class="cinematic-overlay" style="display: none;">
    <div class="cinematic-phrase-wrap">
      <div id="cinematic-phrase-text" class="cinematic-phrase-text"></div>
    </div>
  </div>

  <!-- UI Overlay (Pocket Watch & Create Stage Controls) -->
  <main class="ui-overlay" id="main-ui" style="display: none;">
    <!-- Create Stage Floating Controls -->
    <div class="create-controls-panel" id="create-controls-panel" style="display: none;">
      <div class="create-hints-group">
        <span class="create-hint-item">✦ Mueve para desviar la materia</span>
        <span class="create-hint-item">✦ Mantén presionado para formar un vórtice</span>
        <span class="create-hint-item">✦ Arrastra con velocidad para ramificar</span>
      </div>
      <button id="btn-contemplate" class="btn-contemplate">
        <span class="btn-icon">👁</span> CONTEMPLAR OBRA
      </button>
    </div>

    <!-- Pocket Watch Widget (Bottom Right Navigation) -->
    <div class="watch-widget-container" id="watch-container">
      <canvas id="pocket-watch-canvas"></canvas>
      <div class="watch-hint" id="watch-hint">Gira el reloj para avanzar</div>
    </div>
  </main>

  <!-- Final Reflection Overlay: Direct over the living artwork (Phrase by Phrase) -->
  <div id="final-reflection-overlay" class="final-reflection-overlay" style="display: none;">
    <div class="final-phrase-container">
      <div id="final-phrase-element" class="final-phrase-badge"></div>
    </div>

    <!-- Subtle post-reflection controls (Appears only after all phrases are read) -->
    <div id="final-controls" class="final-controls" style="display: none;">
      <button class="final-action-btn secondary" id="btn-resume-creating">
        <span class="action-icon">🎨</span> Continuar Interviniendo
      </button>
      <button class="final-action-btn tertiary" id="btn-restart-experience">
        <span class="action-icon">↺</span> Volver a la Madriguera
      </button>
    </div>
  </div>

  <!-- Standalone script bundle -->
  <script src="js/bundle.js"></script>
</body>
</html>
